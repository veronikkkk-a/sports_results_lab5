[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-streaming-lab05"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
sports-streaming = "sports_streaming.main:main"

[tool.setuptools.packages.find]
where = ["src"]
